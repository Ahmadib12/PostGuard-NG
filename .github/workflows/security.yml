name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MOCK_NIPOST: "true"
      POSTGUARD_DEMO_CLIENT_SECRET: "ci-demo-secret-with-at-least-32-bytes"
      POSTGUARD_PARTNER_X_SECRET: "ci-partner-secret-with-at-least-32-bytes"
      ADMIN_COOKIE_SECURE: "false"
      DASHBOARD_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run Bandit
        run: bandit -q -r app.py admin_api.py config.py dashboard_store.py iam.py intelligence.py security.py migrations/versions/0005_administrator_iam.py migrations/versions/0006_security_incidents.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high
      - name: Build and smoke-test backend image
        run: |
          set -euo pipefail
          image=postguard-ng:ci
          network=postguard-ci
          docker network create "$network"
          cleanup() {
            docker rm -f postguard-ci-app postguard-ci-redis >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --tag "$image" .
          docker run --detach --name postguard-ci-redis --network "$network" redis:7-alpine
          docker run --detach \
            --name postguard-ci-app \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --env APP_ENV=production \
            --env MOCK_NIPOST=true \
            --env TRUSTED_HOSTS=localhost \
            --env REDIS_URL=redis://postguard-ci-redis:6379/0 \
            --env DASHBOARD_DATABASE_URL=sqlite:///:memory: \
            --env ADMIN_USERNAME=ci-admin \
            --env ADMIN_PASSWORD=ci-smoke-password-long-enough \
            --env ADMIN_COOKIE_SECURE=true \
            --env POSTGUARD_DEMO_CLIENT_SECRET=ci-demo-secret-with-at-least-32-bytes \
            --env POSTGUARD_PARTNER_X_SECRET=ci-partner-secret-with-at-least-32-bytes \
            "$image"

          for attempt in $(seq 1 45); do
            health=$(docker inspect --format='{{.State.Health.Status}}' postguard-ci-app)
            if [ "$health" = healthy ]; then
              echo "Backend container started and passed its health check."
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              docker logs postguard-ci-app
              exit 1
            fi
            sleep 2
          done
          docker logs postguard-ci-app
          echo "Backend container did not become healthy in time."
          exit 1
