name: Tests and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MOCK_NIPOST: "true"
      POSTGUARD_DEMO_CLIENT_SECRET: "ci-demo-secret-with-at-least-32-bytes"
      POSTGUARD_PARTNER_X_SECRET: "ci-partner-secret-with-at-least-32-bytes"
      ADMIN_COOKIE_SECURE: "false"
      DASHBOARD_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run Bandit
        run: bandit -q -r app.py admin_api.py config.py dashboard_store.py iam.py intelligence.py security.py migrations/versions/0005_administrator_iam.py migrations/versions/0006_security_incidents.py
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high
